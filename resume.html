<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rakesh Kumar | Resume</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #f3262f;
      --ink: #101010;
      --paper: #f7f4ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "DM Mono", "Courier New", monospace;
    }
    header {
      width: min(100% - 32px, 1180px);
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(247, 244, 238, .25);
    }
    h1 { margin: 0; font: 700 1.2rem/1.1 Georgia, serif; }
    p { margin: 6px 0 0; color: rgba(247, 244, 238, .65); font-size: .68rem; }
    .back {
      color: var(--paper);
      border: 1px solid rgba(247, 244, 238, .45);
      padding: 10px 14px;
      text-decoration: none;
      font-size: .65rem;
      text-transform: uppercase;
    }
    main {
      width: min(100% - 32px, 960px);
      margin: 34px auto 64px;
    }
    .resume-page {
      margin: 0 auto 30px;
      background: var(--paper);
      box-shadow: 0 16px 45px rgba(0, 0, 0, .35);
    }
    .resume-page img { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) {
      header { align-items: flex-start; }
      .back { flex-shrink: 0; padding: 8px 10px; }
      main { margin-top: 20px; }
      .resume-page { margin-bottom: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Resume</h1>
      <p>Page 1 and page 2</p>
    </div>
    <a class="back" href="index.html">Back to portfolio</a>
  </header>

  <main>
    <section class="resume-page" aria-label="Resume page 1">
      <img src="resume/resume page 1.jpg" alt="Resume page 1">
    </section>
    <section class="resume-page" aria-label="Resume page 2">
      <img src="resume/resume page 2.jpg" alt="Resume page 2">
    </section>
  </main>
</body>
</html>
